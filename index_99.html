<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nota Thermal 80mm</title>

<link rel="stylesheet" href="style_99.css">
</head>
<body>

<div class="panel">

    <h2>Generator Nota</h2>

    <input
        type="text"
        id="barang"
        placeholder="Nama Barang">

    <input
        type="number"
        id="harga"
        placeholder="Harga">

    <button onclick="generateNota()">
        Generate Nota
    </button>

    <button onclick="window.print()">
        Print Nota
    </button>

</div>

<div class="receipt">

    <div class="logo">
        <img src="foto.png">
    </div>

    <div class="store">
        <div>JL. NGESREP TIMUR V NO.112A</div>
        <div>SUMURBOTO, BANYUMANIK</div>
        <div>SEMARANG</div>
    </div>

    <div class="date">
        Date : <span id="date"></span>
    </div>

    <div class="unit-row">
        <span>Unit : 99 / IKSAN</span>
        <span id="trx"></span>
    </div>

    <div class="line"></div>

    <div class="item">

        <div class="item-header">

            <span id="namaBarang">
                BLOODS, BLBLO-YI042, WL
            </span>

            <span>
                NON
            </span>

        </div>

        <div class="item-name">
            XPOST
        </div>

        <div class="item-price">

            <span>1</span>

            <span id="hargaBarang">
                119.000
            </span>

            <span id="subtotal">
                119.000
            </span>

        </div>

    </div>

    <div class="line"></div>

    <div class="row">
        <span>TOTAL (IDR)</span>
        <span id="total">119.000</span>
    </div>

    <div class="line"></div>

    <div class="row">
        <span>CASH (IDR)</span>
        <span id="cash">119.000</span>
    </div>

    <div class="line"></div>

    <div class="row">
        <span>PAID (IDR)</span>
        <span id="paid">119.000</span>
    </div>

    <div class="row">
        <span>CHANGE (IDR)</span>
        <span>0</span>
    </div>

    <div class="line"></div>

    <div class="row">
        <span>YOU SAVE (IDR)</span>
        <span>-</span>
    </div>

    <div class="line"></div>

    <div class="footer">

        <div class="website">
            www.bloods-industries.co
        </div>

        <div class="thanks">
            THANK YOU FOR SHOPPING
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
